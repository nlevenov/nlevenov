[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socprio"
version = "1.0.0"
description = "SOC alert triage engine: parses SIEM/IDS alerts, enriches them with threat intelligence and ranks them by risk."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikola Levenov" }]
requires-python = ">=3.10"
keywords = ["soc", "siem", "threat-intelligence", "alert-triage", "blue-team", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "plotly>=5.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
socprio = "socprio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
socprio = ["api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["socprio"]
known-local-folder = ["helpers"]
